name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-setup.txt
      - run: python -m unittest discover -s tests -v
  porter:
    name: Porter (core, parity, UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: porter
          cache-on-failure: true
      - run: node scripts/check-version.mjs
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo test -p ctw-porter-core --locked
      - run: cargo clippy -p ctw-porter-core --all-targets --locked -- -D warnings
      # The Rust table extraction must give the same bytes as scripts/extract_tables.py.
      - name: Parity with the Python setup
        run: |
          sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
          python -m pip install -r ../requirements-setup.txt
          core/tests/parity.sh
  linux:
    name: Linux (game, showcase, mod kit, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (SDL2's video and audio backends, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Build game, showcase and mod kit (no game data needed)
        run: |
          cmake -S . -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build
          ctest --test-dir port/build --output-on-failure
      - name: Report failing tests
        if: failure()
        run: |
          log=port/build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          for t in $(cut -d: -f2 port/build/Testing/Temporary/LastTestsFailed.log 2>/dev/null); do
            out=$(awk -v t="$t" '$0 ~ ("Test: " t "$") {on=1; next} on && /<end of output>/ {exit} on {print}' "$log" \
                  | grep -Ev '^(Command|Directory|Output):|^---|start time' | tail -15 | tr '\n' '|')
            echo "::error title=ctest $t::${out:-no output}"
          done
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # UCRT64: the same C runtime as the WinLibs UCRT toolchain the port is developed with (MINGW64 is deprecated)
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja git
      - name: Build game, showcase and mod kit (no game data needed)
        shell: msys2 {0}
        run: |
          cmake -S . -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build
          ctest --test-dir port/build --output-on-failure
      # Workflow logs need a GitHub login; annotations do not. Report each failing test's FAIL lines as one.
      - name: Report failing tests
        if: failure()
        shell: msys2 {0}
        run: |
          log=port/build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          for t in $(cut -d: -f2 port/build/Testing/Temporary/LastTestsFailed.log 2>/dev/null); do
            out=$(awk -v t="$t" '$0 ~ ("Test: " t "$") {on=1; next} on && /<end of output>/ {exit} on {print}' "$log" \
                  | grep -Ev '^(Command|Directory|Output):|^---|start time' | tail -15 | tr '\n' '|')
            echo "::error title=ctest $t::${out:-no output}"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: porter
          cache-on-failure: true
      - name: Porter UI and build preparation tests
        working-directory: porter
        shell: bash
        run: |
          node scripts/check-version.mjs
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Check the freshly built game payload
        working-directory: porter
        shell: bash
        env:
          CTW_GAME_BUILD: ${{ github.workspace }}/port/build
        run: node scripts/build-game.mjs
      - name: Porter core tests
        working-directory: porter
        run: cargo test -p ctw-porter-core --locked
      - name: Porter Clippy, with the freshly built game inside
        working-directory: porter
        timeout-minutes: 30
        env:
          CTW_GAME_BUILD: ${{ github.workspace }}/port/build
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Python tests
        run: |
          python -m pip install -r requirements-setup.txt
          python -m unittest discover -s tests -v
