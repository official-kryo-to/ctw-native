name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-setup.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_files.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: Build game and showcase without game data
        shell: msys2 {0}
        run: |
          cmake -S port -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build
      - name: Build mod kit
        shell: msys2 {0}
        run: |
          cmake -S ctw-modkit -B ctw-modkit/build -G Ninja
          cmake --build ctw-modkit/build
