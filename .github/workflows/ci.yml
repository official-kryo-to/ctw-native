name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-setup.txt
      - run: python -m unittest discover -s tests -v
  porter:
    name: Porter (core, parity, UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: porter
      - run: node scripts/check-version.mjs
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo fmt --all --check
      - run: cargo test -p ctw-porter-core
      - run: cargo clippy -p ctw-porter-core --all-targets -- -D warnings
      # The Rust table extraction must give the same bytes as scripts/extract_tables.py.
      - name: Parity with the Python setup
        run: |
          sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
          python -m pip install -r ../requirements-setup.txt
          core/tests/parity.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: Build game, showcase and mod kit (no game data needed)
        shell: msys2 {0}
        run: |
          cmake -S . -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build port/build
          ctest --test-dir port/build --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: porter
      - name: Porter, with the game just built inside
        working-directory: porter
        shell: bash
        env:
          CTW_GAME_BUILD: ${{ github.workspace }}/port/build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p ctw-porter-core
      - name: Python tests
        run: |
          python -m pip install -r requirements-setup.txt
          python -m unittest discover -s tests -v
